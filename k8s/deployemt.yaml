apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-banking-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-banking-app
  template:
    metadata:
      labels:
        app: simple-banking-app
    spec:
      containers:
      - name: simple-banking-app
        image: YOUR_DOCKERHUB_USERNAME/simple-banking-app:REPLACE_WITH_COMMIT_SHA
        stdin: true
        tty: true

